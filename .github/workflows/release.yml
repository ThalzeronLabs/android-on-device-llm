name: Release

# Push a tag like v0.1.0 → this builds the arm64-v8a release APK and attaches it to a GitHub release.
# Or run it by hand on main ("Run workflow", tag = v0.1.0): it creates that tag on the current commit and releases it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on this commit and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    # A manual run may only release main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that a manual run does not move an existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v1.2.3, got $TAG"; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on $target, not on $GITHUB_SHA"
              exit 1
            fi
          fi

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;4.1.2" > /dev/null

      - name: Generate a throwaway demo signing key
        # Not a production key: it is created here, used once and thrown away with the runner.
        # Nothing secret is stored in the repository or in the repository's settings.
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/demo.jks" -storetype PKCS12 \
            -alias demo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=On-device LLM demo build, O=Thalzeron Labs, C=BR"
          {
            echo "DEMO_KEYSTORE_FILE=$RUNNER_TEMP/demo.jks"
            echo "DEMO_KEYSTORE_PASSWORD=$password"
            echo "DEMO_KEY_ALIAS=demo"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease

      - name: Check the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
          # The release must carry the arm64 engine and nothing else.
          unzip -l "$apk" | grep -q "lib/arm64-v8a/" || { echo "::error::no arm64-v8a library in the APK"; exit 1; }
          if unzip -l "$apk" | grep -q "lib/x86"; then echo "::error::x86 libraries in the APK"; exit 1; fi
          name="on-device-llm-$TAG-arm64-v8a.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Write the release notes
        run: |
          version="${TAG#v}"
          apk_sha=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          cert_sha=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -1)
          size_mb=$(du -m "dist/on-device-llm-$TAG-arm64-v8a.apk" | cut -f1)
          {
            echo "> **Demo build, not from Google Play.** Signed with a throwaway key generated by the"
            echo "> [release workflow](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/.github/workflows/release.yml)"
            echo "> for this build only. Each release gets a new key, so to update, uninstall the previous version first."
            echo
            echo "## Try it in 1 minute"
            echo
            echo "1. Download **on-device-llm-$TAG-arm64-v8a.apk** below (${size_mb} MB) on an Android 8+ phone (arm64)."
            echo "2. Open it and allow \"Install unknown apps\" for your browser or file manager when asked."
            echo "3. Open **On-device LLM**. On Wi-Fi the default model (Qwen2.5-0.5B-Instruct Q4_K_M, ~491 MB) downloads by"
            echo "   itself from Hugging Face, is checked against its SHA-256, and then everything runs offline. Other models"
            echo "   can be picked from the model list in the app."
            echo
            echo "Needs about 1 GB free for the default model. Nothing you type leaves the phone."
            echo
            echo "## What's new"
            echo
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "APK SHA-256:              $apk_sha"
            echo "Signing cert SHA-256:     $cert_sha"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # --target creates the tag on this commit when the run was started by hand.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "On-device LLM $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
