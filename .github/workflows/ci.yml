name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;4.1.2" > /dev/null

      - name: Unit tests and screenshot check
        # verifyRoborazziDebug runs every app unit test and compares the screens with docs/screenshots/.
        # After an intended UI change, run ./gradlew :app:recordRoborazziDebug and commit the new images.
        run: ./gradlew :app:verifyRoborazziDebug :llama:testDebugUnitTest

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            docs/screenshots/*_compare.png
            docs/screenshots/*_actual.png
          if-no-files-found: ignore

      - name: Build the APK
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: on-device-llm-apk
          path: app/build/outputs/apk/release/*.apk
